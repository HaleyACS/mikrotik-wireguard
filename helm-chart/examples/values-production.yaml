image:
  repository: ghcr.io/your-org/mikrotik-wireguard
  tag: latest

config:
  servers:
    main:
      credentialsSecret:
        name: mikrotik-wireguard-credentials
        usernameKey: username
        passwordKey: password
      api_mode: rest
      host: 192.168.88.1
      interface: wireguard1
      subnet: 10.50.0.0/24
      server_ip: 10.50.0.1
      endpoint: vpn.example.com:51820 # client WireGuard endpoint
      client_allowed_ips: 10.50.0.0/24
      client_dns:
        - "1.1.1.1"
        - "1.0.0.1"

persistence:
  enabled: true
  size: 1Gi

service:
  type: ClusterIP

ingress:
  enabled: false
